name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: GitHub release
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Create the GitHub release
        run: |
          flags=()
          [[ $TAG == *-* ]] && flags+=(--prerelease)
          gh release view "$TAG" >/dev/null 2>&1 && exit 0
          gh release create "$TAG" --verify-tag --generate-notes --title "hub ${TAG#v}" "${flags[@]}" ||
            gh release view "$TAG" >/dev/null

  formula:
    name: Homebrew formula
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # Every run points the formula at the newest stable release, so it does not matter
    # which of several queued runs GitHub keeps.
    concurrency:
      group: release-formula
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Update the Homebrew formula
        run: |
          gh auth setup-git
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tag=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName -q '.[0].tagName')
          script/update-formula "$tag"
          git diff --quiet -- Formula/hub.rb && exit 0
          git commit -m "Formula: hub $tag" -- Formula/hub.rb
          git push origin main || { git pull --rebase origin main && git push origin main; }
